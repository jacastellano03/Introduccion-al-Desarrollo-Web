<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Netflix</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div class="contenedor">

        <h1>Mini Netflix</h1>

        <form class="formulario" id="formularioPeliculas">

            <h2>Registrar Película</h2>

            <label for="titulo">Título de la película:</label>

            <input
                type="text"
                id="titulo"
                placeholder="Ingrese el título"
                required
            >

            <label for="genero">Género:</label>

            <select id="genero" required>

                <option value="">Seleccione un género</option>
                <option value="Acción">Acción</option>
                <option value="Comedia">Comedia</option>
                <option value="Terror">Terror</option>
                <option value="Ciencia Ficción">Ciencia Ficción</option>
                <option value="Romance">Romance</option>

            </select>

            <label for="anio">Año de estreno:</label>

            <input
                type="number"
                id="anio"
                placeholder="Ingrese el año"
                min="1900"
                max="2026"
                required
            >

            <label for="imagen">URL del póster:</label>

            <input
                type="text"
                id="imagen"
                placeholder="Ejemplo: img/peli1.jpg"
                required
            >

            <button id="agregar" type="submit">

                Agregar Película

            </button>

            <p id="mensaje"></p>

        </form>

        <h2>Catálogo de Películas</h2>

        <div id="catalogo" class="catalogo">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
